name: Bygg och testa

on:
    push:
        branches: [ main ]
    pull_request:

jobs:
    bygg:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Installera .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Hämta paket
              run: dotnet restore

            - name: Bygg
              run: dotnet build --no-restore

            - name: Testa
              run: |
                  dotnet test --no-build \
                      --logger "trx;LogFileName=resultat.trx"

            - name: Spara testrapporten
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: testresultat
                  path: '**/resultat.trx'
                  
